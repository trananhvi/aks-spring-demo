# Throwaway workflow. Its only job is to prove the OIDC trust works.
# Delete it once you've seen it go green.

name: Verify Azure Login

on:
  # No push trigger on purpose. workflow_dispatch adds a "Run workflow"
  # button in the Actions tab, so you can re-run it without inventing
  # dummy commits every time you tweak something.
  workflow_dispatch:

# Required for OIDC. `id-token: write` lets the job ask GitHub for a
# signed token to present to Azure. Declaring `permissions` at all sets
# every unlisted scope to `none`, which is why `contents: read` has to
# be spelled out even though it sounds like a default.
permissions:
  id-token: write
  contents: read

jobs:
  verify:
    # A fresh Ubuntu VM, created for this job and destroyed after it.
    # Nothing persists between runs, and nothing persists between jobs.
    runs-on: ubuntu-latest

    steps:
      # No secret is sent. The action requests a token from GitHub,
      # hands it to Azure, and Azure checks it against the federated
      # credential you registered. The three values below are just
      # identifiers - they are useless to anyone without that trust rule.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # If this prints your subscription, the whole chain works:
      # federated credential, service principal, and role assignments.
      - name: Confirm identity and access
        run: |
          az account show -o table
          echo "--- resource groups visible to this identity ---"
          az group list -o table
